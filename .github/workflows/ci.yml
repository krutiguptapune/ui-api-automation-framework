name: UI and API Automation Tests

# Run workflow when code is pushed or a pull request is created
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      SAUCEDEMO_BASE_URL: https://www.saucedemo.com
      SAUCEDEMO_USERNAME: standard_user
      SAUCEDEMO_PASSWORD: secret_sauce
      THE_INTERNET_BASE_URL: https://the-internet.herokuapp.com
      RESTFUL_BOOKER_BASE_URL: https://restful-booker.herokuapp.com
      RESTFUL_BOOKER_USERNAME: admin
      RESTFUL_BOOKER_PASSWORD: password123
      JSONPLACEHOLDER_BASE_URL: https://jsonplaceholder.typicode.com

    steps:
      # Step 1: Download project code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Install Playwright browser
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Step 5: Create reports folder
      - name: Create reports directory
        run: mkdir -p reports

      # Step 6: Run all UI and API tests
      - name: Run automation tests
        run: pytest -v --html=reports/full-report.html --self-contained-html

      # Step 7: Save HTML report
      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-report
          path: reports/full-report.html

      # Step 8: Upload failure screenshots
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: reports/*.png
          if-no-files-found: ignore

      # Upload Playwright traces
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/*-trace.zip
          if-no-files-found: ignore